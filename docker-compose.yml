services:
  neo4j:
    image: neo4j:5.23-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-replace-with-a-local-password}"
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD:-replace-with-a-local-password}" "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  app:
    build: .
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-replace-with-a-local-password}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      API_PORT: "${API_PORT:-8000}"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('API_PORT','8000') + '/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
